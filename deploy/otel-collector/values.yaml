# OpenTelemetry Collector — ships pod logs and Kubernetes pod/node metrics to New Relic.
#
# One DaemonSet on a single-node cluster is exactly one pod, so the cluster-level
# receiver needs no leader election.
#
# Applied by hand, like Caddy: it changes rarely and is not part of either
# service's release pipeline.
#   kubectl create namespace monitoring
#   kubectl -n monitoring create secret generic newrelic-license \
#     --from-literal=license-key='<key>'
#   helm repo add open-telemetry \
#     https://open-telemetry.github.io/opentelemetry-helm-charts
#   helm upgrade --install otel-collector \
#     open-telemetry/opentelemetry-collector -n monitoring -f values.yaml
#
# Verified against chart 0.173.1 / collector 0.160.0 with `helm template`.
#
# Component names use the chart's current spelling (file_log, k8s_attributes,
# otlp_http) rather than the older aliases, which the chart still rewrites but
# warns about on every install. `kubeletstats` is the exception: that receiver is
# generated by the kubeletMetrics preset, so the pipeline has to reference the
# name the preset emits, not the collector's newer kubelet_stats alias.

mode: daemonset

# Required by the chart — it has no default. The k8s distribution carries the
# four components used below: filelog, kubeletstats, k8s_cluster, k8sattributes.
image:
  repository: otel/opentelemetry-collector-k8s

presets:
  # Tails /var/log/pods — every pod on the node, not just the two APIs.
  logsCollection:
    enabled: true
  # Tags each record with pod/namespace/deployment, which is how you filter to
  # one service in New Relic.
  kubernetesAttributes:
    enabled: true
  # Per-pod and per-node CPU, memory, filesystem, network.
  kubeletMetrics:
    enabled: true
  # Pod phase, restart counts, node conditions, deployment replica status.
  clusterMetrics:
    enabled: true

# The node has ~1030 MB available and k3s itself already holds 452 MB, so the
# collector is capped rather than left to grow. memory_limiter derives its own
# thresholds from this limit.
resources:
  requests:
    memory: 96Mi
  limits:
    memory: 192Mi

extraEnvs:
  - name: NEW_RELIC_LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: newrelic-license
        key: license-key

config:
  receivers:
    # Nothing in this cluster speaks Jaeger, Zipkin or Prometheus. Dropping the
    # listeners keeps the footprint down.
    jaeger: null
    zipkin: null
    prometheus: null
    otlp: null
    file_log:
      # Must stay true: the container parser below derives k8s.pod.name,
      # k8s.namespace.name and k8s.container.name FROM this path. It is dropped
      # after the parser has used it, so it never reaches New Relic.
      include_file_path: true
      operators:
        # Unwraps the containerd log envelope (stream, timestamp).
        - id: container-parser
          type: container
          max_log_size: 102400
        # Both APIs emit AddJsonConsole output, so lift it into real fields —
        # this is what makes LogLevel and CorrelationId queryable in New Relic.
        # Guarded: Caddy and coredns log plain text, and an unguarded parser
        # would error on every one of their lines.
        # Now that the parser has read the path, drop it: k8s.pod.name and
        # k8s.container.name say the same thing more readably.
        - id: drop-file-path
          type: remove
          field: attributes["log.file.path"]
          if: 'attributes["log.file.path"] != nil'
        # containerd plumbing, not information: logtag is the partial/full line
        # marker and iostream is stdout vs stderr. Guarded so a record without
        # them does not error.
        - id: drop-logtag
          type: remove
          field: attributes.logtag
          if: 'attributes.logtag != nil'
        - id: drop-iostream
          type: remove
          field: attributes["log.iostream"]
          if: 'attributes["log.iostream"] != nil'
        - id: app-json
          type: json_parser
          if: 'body matches "^\\{"'
          parse_from: body
          severity:
            parse_from: attributes.LogLevel
            mapping:
              trace: Trace
              debug: Debug
              info: Information
              warn: Warning
              error: Error
              fatal: Critical
  exporters:
    debug: null
    otlp_http:
      endpoint: https://otlp.nr-data.net
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}
  service:
    pipelines:
      logs:
        receivers: [file_log]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_http]
      metrics:
        receivers: [kubeletstats, k8s_cluster]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_http]
      traces: null
