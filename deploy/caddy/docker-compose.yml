# Caddy — TLS termination and hostname routing for both EMT APIs.
#
# The `emt` network is created once, outside compose, so the API containers
# Octopus deploys can join it independently of Caddy's lifecycle:
#   docker network create emt
#
# Deploy/reload:
#   cd ~/emt/caddy && docker compose up -d
#   docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile

services:
  caddy:
    image: caddy:2-alpine
    container_name: emt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing every cert,
      # which is what burns Let's Encrypt rate limits — keep it.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - emt

networks:
  emt:
    external: true

volumes:
  caddy_data:
  caddy_config:
